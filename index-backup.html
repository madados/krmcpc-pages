<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRMPC 口溶膜产品展示</title>
<!-- CloudBase JS SDK -->
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.1/cloudbase.full.js"></script>
<style>
/* ===== GLOBAL RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#667eea;
  --primary-dark:#764ba2;
  --bg:#f8f9fb;
  --card-bg:#fff;
  --text:#333;
  --text-light:#888;
  --border:#e0e4ec;
  --radius:12px;
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --transition:.25s cubic-bezier(.4,0,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--primary);text-decoration:none}
img{display:block;max-width:100%}

/* ===== HEADER ===== */
.site-header{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff;
  padding:60px 20px 50px;
  text-align:center;
  position:relative;
  overflow:visible;
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.site-header::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:40px;
  background:var(--bg);border-radius:20px 20px 0 0;
}
.site-header h1{
  font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.5px;
  margin-bottom:12px;
  line-height:1.3;
  word-break:break-word;
}
.site-header p{opacity:.9;font-size:16px;margin-top:8px}

/* ===== CONTROLS BAR ===== */
.controls{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:10px 24px;
  display:flex;align-items:center;gap:8px;
  overflow-x:auto;
}
.controls::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;padding:6px 16px;border-radius:20px;
  border:1.5px solid var(--border);background:#fff;
  font-size:13px;font-weight:500;cursor:pointer;
  transition:var(--transition);color:#666;
}
.cat-btn:hover{border-color:var(--primary);color:var(--primary)}
.cat-btn.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  border-color:transparent;color:#fff;
  box-shadow:0 4px 15px rgba(102,126,234,.3);
}
.admin-link{
  margin-left:auto;flex-shrink:0;
  padding:6px 16px;border-radius:20px;
  border:1.5px solid #e74c3c;color:#e74c3c;
  background:#fff;font-size:13px;font-weight:600;
  cursor:pointer;transition:var(--transition);
}
.admin-link:hover{background:#e74c3c;color:#fff}

/* ===== MAIN GRID ===== */
.main{max-width:1280px;margin:0 auto;padding:30px 24px 80px}
.cards-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:24px;
}

/* ===== PRODUCT CARD ===== */
.card{
  background:var(--card-bg);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
  transition:var(--transition);position:relative;
}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.12)}
.card-img{
  width:100%;aspect-ratio:4/3;object-fit:cover;
  background:#f0f0f0;
}
.card-body{padding:16px 20px 20px}
.card-title{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.4}
.card-desc{font-size:13px;color:var(--text-light);line-height:1.6;margin-bottom:12px}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.card-tag{
  font-size:11px;padding:3px 10px;border-radius:12px;
  background:#f0f1f5;color:#666;font-weight:500;
}
.card-tag.cat-pet{background:#fff3e0;color:#e65100}
.card-tag.cat-health{background:#e8f5e9;color:#2e7d32}
.card-tag.cat-pharma{background:#e3f2fd;color:#1565c0}

/* ===== LOADING / EMPTY ===== */
.loading{text-align:center;padding:60px 0;color:var(--text-light)}
.loading .spinner{
  display:inline-block;width:32px;height:32px;
  border:3px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{margin-top:12px;font-size:14px}
.empty{text-align:center;padding:80px 0;color:var(--text-light)}
.empty .icon{font-size:48px;margin-bottom:12px}

/* ===== FOOTER ===== */
.site-footer{
  text-align:center;padding:30px 0;
  font-size:12px;color:#bbb;border-top:1px solid var(--border);
}

/* ===== LIGHTBOX ===== */
.lightbox{
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;
  cursor:zoom-out;
}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}

/* ===== RESPONSIVE ===== */
@media(max-width:640px){
  .cards-grid{grid-template-columns:1fr}
  .controls{padding:8px 16px}
  .main{padding:20px 16px 60px}
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <h1>KRMPC 口溶膜产品展示</h1>
  <p>Oral Dissolving Film · 实时数据驱动</p>
</header>

<!-- ===== CONTROLS ===== -->
<nav class="controls">
  <button class="cat-btn active" data-cat="all">全部</button>
  <button class="cat-btn" data-cat="宠物">🐾 宠物</button>
  <button class="cat-btn" data-cat="大健康">💚 大健康</button>
  <button class="cat-btn" data-cat="医药">💊 医药</button>
  <button class="admin-link" onclick="location.href='admin.html'">⚙️ 管理后台</button>
</nav>

<!-- ===== MAIN CONTENT ===== -->
<main class="main">
  <div class="cards-grid" id="productGrid">
    <!-- Cards will be rendered here by JS -->
  </div>
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p>正在加载产品数据...</p>
  </div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="icon">📦</div>
    <p>暂无产品数据</p>
  </div>
</main>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightboxImg" src="" alt="">
</div>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <p>© 2026 KRMPC · 口溶膜产品展示系统 · 数据实时同步中</p>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
// ===== CloudBase Config =====
const ENV_ID = 'kourongmo-d3g3hjn7n3c76c396';
let app, db;

// Initialize CloudBase
function initCloud() {
  try {
    app = cloudbase.init({ env: ENV_ID });
    db = app.database();
    console.log('✅ CloudBase initialized');
    return true;
  } catch (e) {
    console.error('❌ CloudBase init failed:', e);
    return false;
  }
}

// ===== Data Layer =====
let allProducts = [];
let allBrands = [];
let currentCat = 'all';

async function loadData() {
  showLoading(true);
  try {
    // 通过云函数获取数据（绕过安全规则限制）
    console.log('🔄 通过云函数加载数据...');
    const result = await app.callFunction({
      name: 'db-proxy',
      data: { action: 'loadAll' }
    });

    if (result.result && result.result.success) {
      allBrands = result.result.data.brands || [];
      allProducts = result.result.data.products || [];
      console.log(`📦 Loaded: ${allBrands.length} brands, ${allProducts.length} products`);
      renderProducts();
    } else {
      throw new Error(result.result?.error || '云函数返回失败');
    }
  } catch (e) {
    console.error('❌ Load error:', e);
    showError('数据加载失败，请检查网络连接或联系管理员');
  }
  showLoading(false);
}

// ===== Rendering =====
function renderProducts() {
  const grid = document.getElementById('productGrid');
  const filtered = currentCat === 'all'
    ? allProducts
    : allProducts.filter(p => {
        const brand = allBrands.find(b => b.brandId === p.brandId);
        return brand && brand.category === currentCat;
      });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  grid.innerHTML = filtered.map(p => renderCard(p)).join('');
}

function renderCard(p) {
  const brand = allBrands.find(b => b.brandId === p.brandId) || {};
  const img = (p.images && p.images[0]) ? p.images[0] : '';
  const catClass = brand.category === '宠物' ? 'cat-pet'
                 : brand.category === '医药' ? 'cat-pharma'
                 : 'cat-health';
  const catLabel = brand.category || '大健康';

  return `
    <div class="card">
      <img class="card-img"
           src="${img}"
           alt="${escHtml(p.name)}"
           loading="lazy"
           onclick="openLightbox('${img}')"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 300%22><rect fill=%22%23f0f0f0%22 width=%22400%22 height=%22300%22/><text x=%2250%%22 y=%2250%%22 fill=%22%23ccc%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2218%22>暂无图片</text></svg>'">
      <div class="card-body">
        <div class="card-title">${escHtml(p.name)}</div>
        <div class="card-desc">${escHtml(p.description || p.subtitle || '')}</div>
        <div class="card-tags">
          <span class="card-tag ${catClass}">${catLabel}</span>
          ${brand.name ? `<span class="card-tag">${escHtml(brand.name)}</span>` : ''}
          ${p.effects ? `<span class="card-tag">${escHtml(p.effects)}</span>` : ''}
          ${p.specs ? `<span class="card-tag">${escHtml(p.specs)}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

// ===== Lightbox =====
function openLightbox(url) {
  if (!url) return;
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
}

// ===== Category Filter =====
document.querySelector('.controls').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  renderProducts();
});

// ===== Helpers =====
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showLoading(show) {
  document.getElementById('loadingState').style.display = show ? 'block' : 'none';
}
function showError(msg) {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#e74c3c">${escHtml(msg)}</div>`;
}

// ===== Real-time Listener =====
function subscribeRealtime() {
  try {
    // Listen for product changes
    db.collection('products').watch({
      onChange: snapshot => {
        console.log('🔄 Real-time update:', snapshot);
        if (snapshot.type === 'init' || snapshot.docChanges) {
          loadData(); // Reload on any change
        }
      },
      onError: e => console.warn('⚠️ Realtime error:', e)
    });
  } catch(e) {
    console.warn('⚠️ Realtime not available, fallback to manual refresh');
  }
}

// ===== Init =====
(async function() {
  const cloudReady = await initCloud();
  if (cloudReady) {
    loadData();
    // Try to subscribe for real-time updates
    setTimeout(() => subscribeRealtime(), 1000);
  } else {
    showError('云服务初始化失败，请检查网络连接');
  }
})();
</script>
</body>
</html>
