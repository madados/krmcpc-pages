<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudBase连接测试</title>
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/1.7.1/cloudbase.full.js"></script>
<style>
body{font-family:system-ui,sans-serif;padding:20px;background:#f5f5f5}
.test-panel{background:#fff;padding:20px;border-radius:8px;margin:20px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h1{color:#667eea;margin-bottom:20px}
h2{color:#333;font-size:18px;margin-top:20px}
.status{margin:10px 0;padding:10px;background:#f0f0f0;border-radius:4px;font-family:monospace;font-size:13px}
.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.btn{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:4px;cursor:pointer;margin:5px;font-size:14px}
.btn:hover{background:#764ba2}
.log{background:#000;color:#0f0;padding:15px;border-radius:4px;height:300px;overflow-y:scroll;font-family:monospace;font-size:12px;margin-top:10px}
</style>
</head>
<body>

<h1>🔍 CloudBase连接诊断工具</h1>

<div class="test-panel">
  <h2>步骤1：环境配置</h2>
  <p>环境ID：<code>kourongmo-d3g3hjn7n3c76c396</code></p>
  <button class="btn" onclick="testInit()">测试CloudBase初始化</button>
  <div id="initStatus" class="status">等待测试...</div>
</div>

<div class="test-panel">
  <h2>步骤2：数据库权限测试</h2>
  <p>测试是否能读取brands集合数据</p>
  <button class="btn" onclick="testReadBrands()">测试读取品牌数据</button>
  <button class="btn" onclick="testReadProducts()">测试读取产品数据</button>
  <div id="readStatus" class="status">等待测试...</div>
</div>

<div class="test-panel">
  <h2>步骤3：安全规则测试</h2>
  <p>测试当前安全规则配置</p>
  <button class="btn" onclick="testSecurityRules()">检查安全规则</button>
  <div id="securityStatus" class="status">等待测试...</div>
</div>

<div class="test-panel">
  <h2>📋 详细日志</h2>
  <div id="log" class="log"></div>
</div>

<script>
let app, db;

function log(msg) {
  const logEl = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  logEl.innerHTML += `[${time}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(id, success, message) {
  const el = document.getElementById(id);
  el.className = 'status ' + (success ? 'success' : 'error');
  el.innerHTML = (success ? '✅ ' : '❌ ') + message;
}

async function testInit() {
  log('开始测试CloudBase初始化...');
  try {
    app = cloudbase.init({ env: 'kourongmo-d3g3hjn7n3c76c396' });
    db = app.database();
    log('✅ CloudBase初始化成功');
    log('   ENV_ID: kourongmo-d3g3hjn7n3c76c396');
    log('   DB对象已创建');
    setStatus('initStatus', true, 'CloudBase初始化成功');
    return true;
  } catch(e) {
    log('❌ CloudBase初始化失败');
    log('   错误: ' + e.message);
    setStatus('initStatus', false, '初始化失败: ' + e.message);
    return false;
  }
}

async function testReadBrands() {
  log('\n开始测试读取brands集合...');
  
  if (!db) {
    log('⚠️  请先测试CloudBase初始化');
    setStatus('readStatus', false, '请先初始化CloudBase');
    return;
  }
  
  try {
    log('正在查询brands集合...');
    const res = await db.collection('brands').limit(5).get();
    log('✅ 读取成功！');
    log('   找到 ' + res.data.length + ' 个品牌');
    
    if (res.data.length > 0) {
      log('   前3个品牌：');
      res.data.slice(0, 3).forEach((b, i) => {
        log('   ' + (i+1) + '. ' + b.name + ' (' + b.brandId + ')');
      });
    } else {
      log('   ⚠️  集合为空，但没有报错（说明权限正常）');
    }
    
    setStatus('readStatus', true, '成功读取brands数据（' + res.data.length + '条）');
  } catch(e) {
    log('❌ 读取失败！');
    log('   错误代码: ' + (e.code || 'unknown'));
    log('   错误信息: ' + e.message);
    log('   完整错误: ' + JSON.stringify(e));
    
    if (e.message && e.message.includes('permission')) {
      log('\n💡 诊断：权限错误！');
      log('   原因：安全规则未正确配置');
      log('   解决：请在CloudBase控制台设置安全规则为 {"read": true}');
    } else if (e.message && e.message.includes('exist')) {
      log('\n💡 诊断：集合不存在！');
      log('   原因：brands集合未创建');
      log('   解决：请运行 import_to_cloudbase.js 创建集合并导入数据');
    }
    
    setStatus('readStatus', false, '读取失败: ' + e.message);
  }
}

async function testReadProducts() {
  log('\n开始测试读取products集合...');
  
  if (!db) {
    log('⚠️  请先测试CloudBase初始化');
    return;
  }
  
  try {
    log('正在查询products集合...');
    const res = await db.collection('products').limit(5).get();
    log('✅ 读取成功！');
    log('   找到 ' + res.data.length + ' 个产品');
    
    if (res.data.length > 0) {
      log('   前3个产品：');
      res.data.slice(0, 3).forEach((p, i) => {
        log('   ' + (i+1) + '. ' + p.name + ' (品牌: ' + p.brandId + ')');
      });
    }
    
    setStatus('readStatus', true, '成功读取products数据（' + res.data.length + '条）');
  } catch(e) {
    log('❌ 读取失败！');
    log('   错误: ' + e.message);
    setStatus('readStatus', false, '读取失败: ' + e.message);
  }
}

async function testSecurityRules() {
  log('\n开始测试安全规则...');
  log('⚠️  注意：浏览器端无法直接读取安全规则配置');
  log('   但我们可以通过尝试读取数据来测试规则是否生效');
  
  if (!db) {
    await testInit();
  }
  
  try {
    log('\n测试1：尝试读取brands（测试read权限）');
    const res = await db.collection('brands').limit(1).get();
    log('✅ read权限正常（可以读取数据）');
    
    log('\n测试2：检查数据是否存在');
    if (res.data.length === 0) {
      log('   ⚠️  brands集合为空，请先导入数据');
      log('   运行：node import_to_cloudbase.js');
    } else {
      log('   ✓ brands集合有数据');
    }
    
    setStatus('securityStatus', true, '安全规则配置正确，可以读取数据');
    log('\n📊 结论：');
    log('   ✓ CloudBase初始化成功');
    log('   ✓ 数据库read权限正常');
    log('   ✅ 如果首页还是空白，请检查：');
    log('     1. index.html是否正确调用了loadData()');
    log('     2. 浏览器控制台是否有其他错误');
    log('     3. 尝试清除浏览器缓存后刷新');
    
  } catch(e) {
    log('\n❌ 安全规则可能配置错误');
    log('   错误: ' + e.message);
    setStatus('securityStatus', false, '安全规则可能未正确配置');
  }
}

// 页面加载时自动初始化
window.onload = function() {
  log('页面加载完成，准备测试...');
  log('ENV_ID: kourongmo-d3g3hjn7n3c76c396');
  log('安全规则应该配置为：{"read": true, "write": false}');
};
</script>

</body>
</html>
